- id: automation
  label: Automation & PLC/HMI
  title: Industrial Automation & PLC/HMI Integration
  short: PLC programming, HMI touchscreens and control system upgrades.
  img: 1780034766295-43db0f2a0fb7
  alt: Electrical control cabinet with PLC and drives
  intro: Smarter control for new and existing machines — from a single PLC upgrade to full line automation.
  points:
    - PLC programming, automation system development and upgrades.
    - HMI touchscreen development for real-time machine monitoring and control.
    - Integration of Siemens, Allen-Bradley, Schneider Electric and other industrial automation platforms.
