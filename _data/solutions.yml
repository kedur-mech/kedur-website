- id: tank-monitoring
  label: Tank monitoring
  title: Radar Level Sensors & Smart Tank Monitoring
  short: Radar level transmitters and real-time tank, silo and vessel monitoring.
  img: 1589725971211-7e86a631e2c2
  alt: Row of industrial storage silos
  intro: Accurate, real-time level measurement for tanks, silos and vessels — with the alarms and pump control to act on it.
  points:
    - Supply, installation and commissioning of industrial radar level transmitters.
    - Integration of radar sensors with PLC and HMI systems for real-time liquid level indication.
    - Smart monitoring solutions for storage tanks, industrial silos, water tanks and process vessels.
    - High-level and low-level alarms, automatic pump operation, filling control and overflow prevention.
    - Centralised monitoring of multiple tanks through a single HMI display.

