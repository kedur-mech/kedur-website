- id: custom-machinery
  label: Custom machinery
  title: Customised Industrial Machinery Design & Manufacturing
  short: Bespoke machines designed and built around your process and floor space.
  img: 1717386255773-1e3037c81788
  alt: Modern automated production line in a factory
  intro: When standard, off-the-shelf equipment doesn't fit your process, we design and build machinery that does.
