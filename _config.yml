# Site settings for Kedur — built with Jekyll, hosted free on GitHub Pages
title: Kedur
tagline: Mechanical parts, machinery & appliances — supply, sourcing and servicing
description: >-
  Kedur supplies, sources and services mechanical parts, machinery and
  appliances for agriculture, engineering and industry — valves, actuators,
  bearings, compressor and electrical parts, sourced worldwide or
  manufactured to order.
url: "https://www.kedur.co.uk"
baseurl: ""
email: calvin.fernandes@kedur.co.uk

# Contact form: paste your Formspree form endpoint here, e.g. https://formspree.io/f/abcdwxyz
# Until it is set, the form opens the visitor's email app instead.
formspree_endpoint: "https://formspree.io/f/REPLACE_WITH_YOUR_FORM_ID"
locale: en_GB
lang: en-GB

# GitHub Pages-supported plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
